<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Площадка 100×100 · модель с диска + конусы</title>
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden}
  #renderCanvas{width:100%;height:100%;display:block;outline:none;touch-action:none}
  #ui{position:fixed;left:16px;top:16px;z-index:10;
    font:13px/1.5 'IBM Plex Sans',system-ui,sans-serif;color:#d8e5ee;
    background:rgba(12,22,32,.85);border:1px solid #2a4257;padding:12px 14px;
    border-radius:2px;backdrop-filter:blur(4px);width:280px}
  .title{font-weight:600;margin-bottom:2px}
  .spec{color:#7c93a4;font-size:11px;margin-bottom:4px}
  #modelStatus{color:#62d0df;font-size:11px;margin-bottom:8px;min-height:16px}
  .filebtn{width:100%;padding:6px 0;margin-bottom:10px;background:#1c2c3a;color:#9db4c4;
    border:1px solid #2a4257;border-radius:2px;font:600 11px/1 inherit;cursor:pointer}
  .filebtn:hover{border-color:#62d0df;color:#62d0df}
  .modes{display:flex;gap:6px;margin-bottom:10px}
  .modes button{flex:1;padding:7px 4px;background:#1c2c3a;color:#9db4c4;
    border:1px solid #2a4257;border-radius:2px;font:600 11px/1.2 inherit;cursor:pointer;transition:.15s}
  .modes button:hover{border-color:#ff6d00;color:#ff6d00}
  .modes button.active{background:#ff6d00;color:#1a1200;border-color:#ff6d00}
  .count{margin-bottom:6px}.count b{color:#ff6d00}
  #hintline{color:#7c93a4;font-size:12px;margin-bottom:4px;min-height:18px}
  .drive{color:#7c93a4;font-size:11px;margin-bottom:6px}
  .drive b{color:#9db4c4}
  .tele{color:#9db4c4;font-size:12px;margin-bottom:10px}
  .tele b{color:#62d0df}
  #clear{width:100%;padding:6px 0;background:#1c2c3a;color:#9db4c4;
    border:1px solid #2a4257;border-radius:2px;font:600 11px/1 inherit;cursor:pointer}
  #clear:hover{border-color:#e05e4a;color:#e05e4a}
  #cabBtn{width:100%;padding:6px 0;margin-top:6px;background:#1c2c3a;color:#9db4c4;
    border:1px solid #2a4257;border-radius:2px;font:600 11px/1 inherit;cursor:pointer}
  #cabBtn:hover,#cabBtn.active{border-color:#62d0df;color:#62d0df}
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="ui">
  <div class="title">Площадка 100×100 · авто + конусы</div>
  <div class="spec">масштаб под Logan: 4346×1733×1517 · база 2634 · свесы 818/894 · клиренс 155</div>
  <div id="modelStatus">Модель: заглушка</div>
  <select id="autoModel" style="width:100%;padding:6px 4px;margin-bottom:8px;background:#1c2c3a;color:#9db4c4;border:1px solid #2a4257;border-radius:2px;font:600 11px/1 inherit"></select>
  <button class="filebtn" id="pickModel">Выбрать модель с диска (.glb)…</button>
  <input type="file" id="modelFile" accept=".glb,.gltf" style="display:none">
  <div class="modes">
    <button data-mode="place" class="active">Поставить</button>
    <button data-mode="move">Двигать</button>
    <button data-mode="delete">Удалить</button>
  </div>
  <div class="count">Конусов: <b id="count">0</b></div>
  <div id="hintline">Клик по площадке — поставить конус (шаг 0,25 м)</div>
  <div class="drive">Езда: <b>W/A/S/D</b> или стрелки · <b>Space</b> — тормоз</div>
  <div class="tele">Скорость: <b id="spd">0</b> км/ч · Руль: <b id="str">0°</b></div>
  <button id="clear">Очистить конусы (C)</button>
  <button id="cabBtn">Обзор: кабина (V)</button>
</div>

<script>
const canvas=document.getElementById('renderCanvas');
const engine=new BABYLON.Engine(canvas,true,{stencil:true});
const scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.067,0.071,0.075,1);

const CAR={length:4.346,width:1.733,height:1.517,wheelbase:2.634,clearance:0.155,wheelD:0.621,frontOverhang:0.818,rearOverhang:0.894};
CAR.turnDiameter=10.5;
CAR.turnRadius=(CAR.turnDiameter-CAR.width)/2;
CAR.wheelR=CAR.wheelD/2;
CAR.maxSteer=Math.atan(CAR.wheelbase/CAR.turnRadius);

const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=0.55;
const dir=new BABYLON.DirectionalLight('dir',new BABYLON.Vector3(-0.5,-1,-0.3),scene);
dir.position=new BABYLON.Vector3(60,90,40);dir.intensity=0.9;
const shadowGen=new BABYLON.ShadowGenerator(2048,dir);
shadowGen.useBlurExponentialShadowMap=true;shadowGen.blurKernel=32;

const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:100,height:100,subdivisions:2},scene);
const groundMat=new BABYLON.StandardMaterial('gmat',scene);
groundMat.diffuseColor=new BABYLON.Color3(0.10,0.10,0.10);groundMat.specularColor=new BABYLON.Color3(0,0,0);
ground.material=groundMat;ground.receiveShadows=true;
function gridLines(step,half,y){const lines=[];for(let i=-half;i<=half+1e-6;i+=step){
  lines.push([new BABYLON.Vector3(i,y,-half),new BABYLON.Vector3(i,y,half)]);
  lines.push([new BABYLON.Vector3(-half,y,i),new BABYLON.Vector3(half,y,i)]);}return lines;}
const grid=BABYLON.MeshBuilder.CreateLineSystem('grid',{lines:gridLines(0.5,50,0.01)},scene);
grid.color=new BABYLON.Color3(0.30,0.30,0.30);grid.isPickable=false;
const axes=BABYLON.MeshBuilder.CreateLineSystem('axes',{lines:[
  [new BABYLON.Vector3(0,0.02,-50),new BABYLON.Vector3(0,0.02,50)],
  [new BABYLON.Vector3(-50,0.02,0),new BABYLON.Vector3(50,0.02,0)]]},scene);
axes.color=new BABYLON.Color3(0.55,0.55,0.55);axes.isPickable=false;

const STEP=0.25,HALF=50;
const snap=v=>Math.max(-HALF,Math.min(HALF,Math.round(v/STEP)*STEP));
const key=(x,z)=>`${x.toFixed(2)},${z.toFixed(2)}`;
const coneNodes=[];const occupied=new Set();const countEl=document.getElementById('count');
const baseMat=new BABYLON.StandardMaterial('bm',scene);baseMat.diffuseColor=new BABYLON.Color3(0.85,0.26,0.08);baseMat.specularColor=new BABYLON.Color3(0,0,0);
const coneBodyMat=new BABYLON.StandardMaterial('bdc',scene);coneBodyMat.diffuseColor=new BABYLON.Color3(1,0.43,0);coneBodyMat.specularColor=new BABYLON.Color3(0,0,0);
const stripeMat=new BABYLON.StandardMaterial('sm',scene);stripeMat.diffuseColor=new BABYLON.Color3(1,1,1);stripeMat.specularColor=new BABYLON.Color3(0,0,0);
function createCone(){const node=new BABYLON.TransformNode('cone',scene);node.rotationQuaternion=BABYLON.Quaternion.Identity();
  const base=BABYLON.MeshBuilder.CreateBox('cb',{width:0.25,depth:0.25,height:0.035},scene);
  base.parent=node;base.position.y=0.0175;base.material=baseMat;base.metadata={isCone:true};
  const body=BABYLON.MeshBuilder.CreateCylinder('cbd',{diameterTop:0.04,diameterBottom:0.19,height:0.45,tessellation:24},scene);
  body.parent=node;body.position.y=0.26;body.material=coneBodyMat;body.metadata={isCone:true};
  const stripe=BABYLON.MeshBuilder.CreateCylinder('cs',{diameterTop:0.10,diameterBottom:0.14,height:0.11,tessellation:24},scene);
  stripe.parent=node;stripe.position.y=0.255;stripe.material=stripeMat;stripe.metadata={isCone:true};
  [base,body,stripe].forEach(m=>shadowGen.addShadowCaster(m));
  coneNodes.push(node);return node;}
function addConeAt(x,z){const k=key(x,z);if(occupied.has(k))return;occupied.add(k);
  const n=createCone();n.position.set(x,0,z);n.userData={cellKey:k,knocked:false};updateCount();saveCones();}
function deleteCone(n){occupied.delete(n.userData.cellKey);
  n.getChildMeshes().forEach(m=>shadowGen.removeShadowCaster(m));
  const i=coneNodes.indexOf(n);if(i>=0)coneNodes.splice(i,1);n.dispose();updateCount();saveCones();}
function clearCones(){[...coneNodes].forEach(deleteCone);}
function updateCount(){countEl.textContent=coneNodes.length;}

// ── сохранение конусов в localStorage ─────────────
const STORE_KEY='tr_babylon_cones';
function saveCones(){try{localStorage.setItem(STORE_KEY,JSON.stringify(
  coneNodes.map(n=>[Math.round(n.position.x*1e4)/1e4,Math.round(n.position.z*1e4)/1e4])));}catch(e){}}
function loadCones(){try{const data=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');
  if(Array.isArray(data))data.forEach(([x,z])=>{if(typeof x==='number'&&typeof z==='number')addConeAt(x,z);});}catch(e){}}

// ── машина ─────────────────────────────────────────────
let car=null,steerPivots=[],spinPivots=[],primitiveRoot=null,modelCarRoot=null;
let cabMode=false;const cabMats=new Map();
let headYaw=0,headTurn=false;
let carHeight=CAR.height;
const modelStatus=document.getElementById('modelStatus');

function createPrimitiveCar(){
  const root=new BABYLON.TransformNode('car',scene);
  const paint=new BABYLON.StandardMaterial('paint',scene);paint.diffuseColor=new BABYLON.Color3(0.82,0.84,0.86);paint.specularColor=new BABYLON.Color3(0.5,0.5,0.5);
  const glass=new BABYLON.StandardMaterial('glass',scene);glass.diffuseColor=new BABYLON.Color3(0.10,0.13,0.17);glass.specularColor=new BABYLON.Color3(0.5,0.5,0.5);
  const wmat=new BABYLON.StandardMaterial('wmat',scene);wmat.diffuseColor=new BABYLON.Color3(0.10,0.10,0.10);
  const lf=new BABYLON.StandardMaterial('lf',scene);lf.emissiveColor=new BABYLON.Color3(1,0.95,0.7);
  const lr=new BABYLON.StandardMaterial('lr',scene);lr.emissiveColor=new BABYLON.Color3(0.9,0.1,0.1);
  const bodyH=0.60;
  const body=BABYLON.MeshBuilder.CreateBox('body',{width:CAR.width,height:bodyH,depth:CAR.length},scene);
  body.parent=root;body.position.y=CAR.clearance+bodyH/2;body.material=paint;
  const cabinH=CAR.height-(CAR.clearance+bodyH);
  const cabin=BABYLON.MeshBuilder.CreateBox('cabin',{width:CAR.width*0.86,height:cabinH,depth:CAR.length*0.5},scene);
  cabin.parent=root;cabin.position.y=(CAR.clearance+bodyH)+cabinH/2;cabin.position.z=-CAR.length*0.02;cabin.material=glass;
  [-CAR.width*0.32,CAR.width*0.32].forEach((x,i)=>{
    const hl=BABYLON.MeshBuilder.CreateBox('hl'+i,{width:0.34,height:0.14,depth:0.06},scene);
    hl.parent=root;hl.position.set(x,CAR.clearance+bodyH*0.6,CAR.length/2+0.01);hl.material=lf;
    const tl=BABYLON.MeshBuilder.CreateBox('tl'+i,{width:0.30,height:0.16,depth:0.06},scene);
    tl.parent=root;tl.position.set(x,CAR.clearance+bodyH*0.6,-CAR.length/2-0.01);tl.material=lr;});
  const frontZ=CAR.length/2-CAR.frontOverhang,rearZ=-(CAR.length/2-CAR.rearOverhang),wx=CAR.width/2-0.095;
  const spinNodes=[],frontSteers=[];
  [{x:wx,z:frontZ,f:1},{x:-wx,z:frontZ,f:1},{x:wx,z:rearZ,f:0},{x:-wx,z:rearZ,f:0}].forEach((wd,i)=>{
    const pos=new BABYLON.Vector3(wd.x,CAR.wheelR,wd.z);let parent=root;
    if(wd.f){const s=new BABYLON.TransformNode('steer'+i,scene);s.parent=root;s.position.copyFrom(pos);frontSteers.push(s);parent=s;}
    const sp=new BABYLON.TransformNode('spin'+i,scene);sp.parent=parent;if(!wd.f)sp.position.copyFrom(pos);
    const w=BABYLON.MeshBuilder.CreateCylinder('w'+i,{diameter:CAR.wheelD,height:0.19,tessellation:24},scene);
    w.parent=sp;w.rotation.z=Math.PI/2;w.material=wmat;shadowGen.addShadowCaster(w);spinNodes.push(sp);});
  [body,cabin].forEach(m=>shadowGen.addShadowCaster(m));
  return{root,spinNodes,frontSteers};
}
function usePrimitiveCar(){const o=createPrimitiveCar();car=o.root;primitiveRoot=o.root;
  steerPivots=o.frontSteers;spinPivots=o.spinNodes.map(n=>({node:n,radius:CAR.wheelR}));
  modelStatus.textContent='Модель: заглушка — нажми «Выбрать модель с диска»';
  carHeight=CAR.height;
  if(cabMode)applyCabMaterials(true);}
function disposeCurrentCar(){
  if(primitiveRoot){primitiveRoot.getChildMeshes().forEach(m=>shadowGen.removeShadowCaster(m));primitiveRoot.dispose();primitiveRoot=null;}
  if(modelCarRoot){modelCarRoot.getChildMeshes().forEach(m=>shadowGen.removeShadowCaster(m));modelCarRoot.dispose();modelCarRoot=null;}
  steerPivots=[];spinPivots=[];
}
function aggregateBB(node){
  const min=new BABYLON.Vector3(Infinity,Infinity,Infinity),max=new BABYLON.Vector3(-Infinity,-Infinity,-Infinity);
  node.getChildMeshes().forEach(m=>{m.computeWorldMatrix(true);
    const b=m.getBoundingInfo().boundingBox;min.minimizeInPlace(b.minimumWorld);max.maximizeInPlace(b.maximumWorld);});
  return{min,max,size:max.subtract(min),center:min.add(max).scale(0.5)};
}

// применить загруженный файл как машину
function rotateModel(node,yaw,pitch){
  if(node.rotationQuaternion){
    let q=node.rotationQuaternion.clone();
    if(yaw)q=BABYLON.Quaternion.RotationAxis(BABYLON.Axis.Y,yaw).multiply(q);
    if(pitch)q=BABYLON.Quaternion.RotationAxis(BABYLON.Axis.X,pitch).multiply(q);
    node.rotationQuaternion=q;
  }else{
    node.rotation.y+=(yaw||0);
    node.rotation.x+=(pitch||0);
  }
}
function adoptLoadedModel(newMeshes,label,flip,pitchFlip){
  const modelRoot=newMeshes.find(m=>m.name==='__root__')
    ||newMeshes.find(m=>!m.parent&&!['ground','grid','axes','preview'].includes(m.name))
    ||newMeshes[0];
  const carRoot=new BABYLON.TransformNode('carRoot',scene);
  modelRoot.setParent(carRoot,true);
  let bb=aggregateBB(modelRoot);
  const yaw=(bb.size.x>bb.size.z?Math.PI/2:0)+(flip?Math.PI:0)+(pitchFlip?Math.PI:0);
  rotateModel(modelRoot,yaw,pitchFlip?Math.PI:0);
  modelRoot.computeWorldMatrix(true);bb=aggregateBB(modelRoot);
  const s=CAR.length/Math.max(bb.size.x,bb.size.z);
  modelRoot.scaling.setAll(s);
  modelRoot.computeWorldMatrix(true);bb=aggregateBB(modelRoot);
  modelRoot.position.x-=bb.center.x;modelRoot.position.z-=bb.center.z;modelRoot.position.y-=bb.min.y;
  modelRoot.computeWorldMatrix(true);
  carHeight=bb.size.y;
  const steer=[],spin=[];
  const parts=modelRoot.getChildMeshes();
  parts.forEach(m=>{shadowGen.addShadowCaster(m);m.isPickable=false;});
  const wheelMeshes=parts.filter(m=>/wheel|tire|tyre|roue/i.test(m.name));
  wheelMeshes.forEach(wm=>{try{
    wm.computeWorldMatrix(true);
    const b=wm.getBoundingInfo().boundingBox,c=b.centerWorld,r=(b.maximumWorld.y-b.minimumWorld.y)/2;
    let pivotParent=carRoot,off=c;
    if(c.z>0){const st=new BABYLON.TransformNode('steer',scene);st.parent=carRoot;st.position.set(c.x,0,c.z);
      steer.push(st);pivotParent=st;off=new BABYLON.Vector3(0,c.y,0);}
    const sp=new BABYLON.TransformNode('spin',scene);sp.parent=pivotParent;sp.position.copyFrom(off);
    wm.setParent(sp,true);spin.push({node:sp,radius:r||CAR.wheelR});
  }catch(e){}});
  disposeCurrentCar();
  modelCarRoot=carRoot;car=carRoot;steerPivots=steer;spinPivots=spin;
  car.position.set(0,0,0);
  modelStatus.textContent=`Модель: ${label}`+(spin.length?` · колёс: ${spin.length}`:' · колёса не найдены');
  if(cabMode)applyCabMaterials(true);
}

// загрузка модели по url / метке
async function loadModelByName(name,pitchFlip){
  const isGLTF=/\.gltf$/i.test(name);
  const isGLB=/\.glb$/i.test(name);
  const flip=/_flip\.(glb|gltf)$/i.test(name);
  modelStatus.textContent='Загрузка: '+name+'…';
  try{
    const before=new Set(scene.meshes);
    await BABYLON.SceneLoader.AppendAsync('',name,scene,null,isGLTF?'.gltf':'.glb');
    const nm=scene.meshes.filter(m=>!before.has(m));
    if(nm.length)adoptLoadedModel(nm,name,flip,!!pitchFlip);
    else modelStatus.textContent='Не удалось прочитать: '+name;
  }catch(err){
    modelStatus.textContent='Ошибка: '+name;
    console.warn(err);
  }
}

// модели из папки auto — константы с полными названиями и путями
const CAR_MODELS={
  'Audi S4':'auto/AudiS4.glb',
  'BMW M3 Coupe':'auto/BMW_M3_Coupe.glb',
  'BMW M3 GTR':'auto/BMW_M3_GTR.glb',
  'BMW Vision':'auto/BMW_Vision.glb',
  'BYD U9':'auto/BYD_U9.glb',
  'Logan 2 2017':'auto/Logan2_2017.glb',
  'Mazda 3':'auto/Mazda3.glb',
  'Sedan':'auto/Sedan.glb',
  'Volvo S60R':'auto/VolvoS60R.glb',
};
const autoModel=document.getElementById('autoModel');
function fillAutoModel(){
  autoModel.textContent='';
  const stub=document.createElement('option');
  stub.textContent='— заглушка —';stub.value='';autoModel.appendChild(stub);
  for(const[name,path]of Object.entries(CAR_MODELS)){
    const o=document.createElement('option');
    o.textContent=name;o.value=path;autoModel.appendChild(o);
  }
}
fillAutoModel();
autoModel.addEventListener('change',()=>{
  const v=autoModel.value;
  if(!v)usePrimitiveCar();
  else loadModelByName(v,true);
});

// выбор файла с диска
const modelFile=document.getElementById('modelFile');
document.getElementById('pickModel').addEventListener('click',()=>modelFile.click());
modelFile.addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const nameLow=file.name.toLowerCase();
  const isGLTF=nameLow.endsWith('.gltf');
  const isGLB=nameLow.endsWith('.glb');
  if(!isGLTF && !isGLB){
    modelStatus.textContent='Нужен файл .glb или .gltf';
    modelFile.value=''; return;
  }
  const flip=/_flip\.(glb|gltf)$/i.test(file.name);
  const url=URL.createObjectURL(file);
  modelStatus.textContent='Загрузка: '+file.name+'…';
  try{
    const before=new Set(scene.meshes);
    await BABYLON.SceneLoader.AppendAsync('',url,scene,null,isGLTF?'.gltf':'.glb');
    const nm=scene.meshes.filter(m=>!before.has(m));
    if(nm.length)adoptLoadedModel(nm,file.name,flip);
    else modelStatus.textContent='Не удалось прочитать: '+file.name;
  }catch(err){
    modelStatus.textContent='Ошибка: '+file.name;
    console.warn(err);
  }finally{
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    modelFile.value='';
  }
});

usePrimitiveCar();
autoModel.value='auto/Logan2_2017.glb';
loadModelByName('auto/Logan2_2017.glb',true);
loadCones();

const camera=new BABYLON.ArcRotateCamera('cam',-Math.PI/2,1.15,11,new BABYLON.Vector3(0,0,0),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=5;camera.upperRadiusLimit=220;camera.upperBetaLimit=Math.PI/2-0.02;
camera.panningSensibility=0;camera.wheelDeltaPercentage=0.01;camera.minZ=0.1;camera.maxZ=1500;

const cabCam=new BABYLON.UniversalCamera('cab',new BABYLON.Vector3(0,1.5,0),scene);
cabCam.minZ=0.05;cabCam.maxZ=1500;
const cabBtn=document.getElementById('cabBtn');
function applyCabMaterials(on){
  if(!car)return;
  car.getChildMeshes().forEach(m=>{const mat=m.material;
    if(!mat||(mat.metadata&&mat.metadata.isCone))return;
    if(on){if(!cabMats.has(mat))cabMats.set(mat,mat.backFaceCulling);mat.backFaceCulling=false;}
    else if(cabMats.has(mat)){mat.backFaceCulling=cabMats.get(mat);}});
}
function setCabMode(b){
  cabMode=b;
  if(b)headYaw=0;else headTurn=false;
  cabBtn.textContent=b?'Обзор: сзади (V)':'Обзор: кабина (V)';
  cabBtn.classList.toggle('active',b);
  scene.activeCamera=b?cabCam:camera;
  if(b){camera.detachControl();applyCabMaterials(true);}
  else{applyCabMaterials(false);camera.detachControl();camera.attachControl(canvas,true);}
}
cabBtn.addEventListener('click',()=>setCabMode(!cabMode));
canvas.addEventListener('pointerdown',()=>{if(cabMode&&!dragging)headTurn=true;});
addEventListener('pointerup',()=>{headTurn=false;});
addEventListener('pointercancel',()=>{headTurn=false;});
addEventListener('blur',()=>{headTurn=false;});
addEventListener('pointermove',e=>{
  if(cabMode&&headTurn&&!dragging){
    headYaw-=e.movementX*0.005;
    if(headYaw>Math.PI)headYaw-=Math.PI*2;if(headYaw<-Math.PI)headYaw+=Math.PI*2;
  }
});
function driverPoint(localOff){
  const cs=Math.cos(heading),sn=Math.sin(heading);
  return new BABYLON.Vector3(
    car.position.x+localOff.x*cs+localOff.z*sn,
    car.position.y+localOff.y,
    car.position.z-localOff.x*sn+localOff.z*cs);
}

const preview=BABYLON.MeshBuilder.CreateTorus('preview',{diameter:0.4,thickness:0.04,tessellation:28},scene);
const prevMat=new BABYLON.StandardMaterial('pm',scene);
prevMat.diffuseColor=new BABYLON.Color3(1,0.43,0);prevMat.emissiveColor=new BABYLON.Color3(1,0.43,0);
prevMat.alpha=0.85;prevMat.specularColor=new BABYLON.Color3(0,0,0);
preview.material=prevMat;preview.position.y=0.05;preview.isVisible=false;preview.isPickable=false;

let mode='place',dragging=null,dragOldKey=null;
const hintline=document.getElementById('hintline');
const HINTS={place:'Клик по площадке — поставить конус (шаг 0,25 м)',
  move:'Зажми конус и перетащи в новый узел',delete:'Клик по конусу — удалить его'};
const CURSORS={place:'crosshair',move:'grab',delete:'pointer'};
function setMode(m){mode=m;
  document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  hintline.textContent=HINTS[m];canvas.style.cursor=CURSORS[m];preview.isVisible=false;}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.getElementById('clear').addEventListener('click',clearCones);

const keys={forward:false,back:false,left:false,right:false,brake:false};
const keyMap={KeyW:'forward',ArrowUp:'forward',KeyS:'back',ArrowDown:'back',
  KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'brake'};
addEventListener('keydown',e=>{const a=keyMap[e.code];
  if(a!==undefined){keys[a]=true;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();}
  if(e.code==='Digit1')setMode('place');else if(e.code==='Digit2')setMode('move');
  else if(e.code==='Digit3')setMode('delete');else if(e.code==='KeyC')clearCones();
  else if(e.code==='KeyV')setCabMode(!cabMode);});
addEventListener('keyup',e=>{const a=keyMap[e.code];if(a!==undefined)keys[a]=false;});

let speed=0,heading=0,steerAngle=0;
const spdEl=document.getElementById('spd'),strEl=document.getElementById('str');
function rearAxleOffset(){
  const zs=spinPivots.map(p=>p.node.position.z).filter(z=>z<0);
  return zs.length?zs.reduce((a,b)=>a+b,0)/zs.length:-CAR.wheelbase/2;
}
function updateCar(dt){
  let throttle=0,steerInput=0;
  if(keys.forward)throttle+=1;if(keys.back)throttle-=1;
  if(keys.left)steerInput-=1;if(keys.right)steerInput+=1;
  if(throttle>0)speed+=12*dt;else if(throttle<0)speed-=12*dt;
  else{if(speed>0)speed=Math.max(0,speed-7*dt);else speed=Math.min(0,speed+7*dt);}
  if(keys.brake){if(speed>0)speed=Math.max(0,speed-25*dt);else speed=Math.min(0,speed+25*dt);}
  speed=Math.max(-6,Math.min(8/3.6,speed));
  const target=steerInput*CAR.maxSteer,rate=1.6;
  if(steerAngle<target)steerAngle=Math.min(target,steerAngle+rate*dt);
  else if(steerAngle>target)steerAngle=Math.max(target,steerAngle-rate*dt);
  const s0=Math.sin(heading),c0=Math.cos(heading);
  heading+=(speed/CAR.wheelbase)*Math.tan(steerAngle)*dt;
  const s1=Math.sin(heading),c1=Math.cos(heading);
  const rz=rearAxleOffset();
  car.position.x=Math.max(-48,Math.min(48,car.position.x+rz*s0+s0*speed*dt-rz*s1));
  car.position.z=Math.max(-48,Math.min(48,car.position.z+rz*c0+c0*speed*dt-rz*c1));
  car.rotation.y=heading;
  const roll=speed*dt;
  spinPivots.forEach(sp=>sp.node.rotation.x+=roll/sp.radius);
  steerPivots.forEach(s=>s.rotation.y=steerAngle);
  spdEl.textContent=Math.round(Math.abs(speed)*3.6);
  const deg=Math.round(steerAngle*180/Math.PI);
  strEl.textContent=(deg<0?'← ':deg>0?'→ ':'')+Math.abs(deg)+'°';
}
function lerpAngle(a,b,t){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return a+d*t;}
function updateCamera(){const t=camera.target;
  t.x+=(car.position.x-t.x)*0.12;t.y+=((car.position.y+1.2)-t.y)*0.12;t.z+=(car.position.z-t.z)*0.12;
  if(Math.abs(speed)>0.5){const desired=Math.atan2(-Math.cos(heading),-Math.sin(heading));
    camera.alpha=lerpAngle(camera.alpha,desired,0.06);}}

function carHits(px,pz){
  const dx=px-car.position.x,dz=pz-car.position.z;
  const c=Math.cos(heading),s=Math.sin(heading);
  const lx=dx*c-dz*s,lz=dx*s+dz*c;
  return Math.abs(lx)<=CAR.width/2 && Math.abs(lz)<=CAR.length/2;}
function knockCone(node,carPos){node.userData.knocked=true;
  const d=node.position.subtract(carPos);d.y=0;
  if(d.lengthSquared()<1e-6)d.set(0,0,1);d.normalize();
  node.position.addInPlace(d.scale(0.35));
  const axis=BABYLON.Vector3.Cross(BABYLON.Vector3.Up(),d).normalize();
  node.rotationQuaternion=BABYLON.Quaternion.RotationAxis(axis,Math.PI/2*0.95);}
function checkCollisions(){for(const node of coneNodes){const ud=node.userData;
  if(!ud||ud.knocked||node===dragging)continue;
  if(carHits(node.position.x,node.position.z))knockCone(node,car.position);}}

const pickGround=()=>scene.pick(scene.pointerX,scene.pointerY,m=>m.name==='ground');
const pickCone=()=>scene.pick(scene.pointerX,scene.pointerY,m=>m.metadata&&m.metadata.isCone);
scene.onPointerObservable.add(pi=>{const t=pi.type;
  if(t===BABYLON.PointerEventTypes.POINTERMOVE){
    const p=pickGround();
    if(p.hit){const sx=snap(p.pickedPoint.x),sz=snap(p.pickedPoint.z);
      preview.position.set(sx,0.05,sz);preview.isVisible=(mode==='place')||!!dragging;
      if(dragging)dragging.position.set(sx,0,sz);}
    else if(!dragging)preview.isVisible=false;}
  else if(t===BABYLON.PointerEventTypes.POINTERDOWN){
    if(mode==='move'){const c=pickCone();
      if(c.hit){dragging=c.pickedMesh.parent;const ud=dragging.userData;
        dragging.rotationQuaternion=BABYLON.Quaternion.Identity();ud.knocked=false;
        dragOldKey=ud.cellKey;occupied.delete(dragOldKey);
        camera.detachControl();canvas.style.cursor='grabbing';}}}
  else if(t===BABYLON.PointerEventTypes.POINTERUP){
    if(dragging){const x=snap(dragging.position.x),z=snap(dragging.position.z),k=key(x,z);
      const ud=dragging.userData;
      if(occupied.has(k)){const[ox,oz]=dragOldKey.split(',').map(Number);
        dragging.position.set(ox,0,oz);occupied.add(dragOldKey);ud.cellKey=dragOldKey;}
      else{dragging.position.set(x,0,z);occupied.add(k);ud.cellKey=k;}
      updateCount();saveCones();
      dragging=null;camera.attachControl(canvas,true);canvas.style.cursor=CURSORS[mode];}}
  else if(t===BABYLON.PointerEventTypes.POINTERTAP){
    if(dragging)return;
    if(mode==='delete'){const c=pickCone();if(c.hit)deleteCone(c.pickedMesh.parent);}
    else if(mode==='place'){const p=pickGround();if(p.hit)addConeAt(snap(p.pickedPoint.x),snap(p.pickedPoint.z));}}});

scene.onBeforeRenderObservable.add(()=>{const dt=Math.min(engine.getDeltaTime()/1000,0.05);
  if(cabMode){
    const L=10.45,HX=-0.38,HY=carHeight*0.85,HZ=-0.1,
      sy=Math.sin(headYaw),cy=Math.cos(headYaw);
    cabCam.position.copyFrom(driverPoint(new BABYLON.Vector3(HX,HY,HZ)));
    cabCam.setTarget(driverPoint(new BABYLON.Vector3(HX+L*sy,HY,HZ+L*cy)));
  }
  updateCar(dt);updateCamera();checkCollisions();});
engine.runRenderLoop(()=>scene.render());
addEventListener('resize',()=>engine.resize());
setMode('place');
</script>

</body>
</html>
