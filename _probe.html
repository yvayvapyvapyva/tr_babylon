<!DOCTYPE html><html><head><meta charset="utf-8">
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head><body><canvas id="c" width="64" height="64"></canvas><pre id="out"></pre>
<script>
const canvas=document.getElementById('c');
const engine=new BABYLON.Engine(canvas,true);
const scene=new BABYLON.Scene(engine);
window.__scene=scene;
scene.clearColor=new BABYLON.Color4(0.1,0.1,0.1,1);
const out=document.getElementById('out');
const log=s=>out.textContent+=(out.textContent?'\n':'')+s;
const V=BABYLON.Vector3,bab=BABYLON;
(async()=>{
  try{
    const res=await BABYLON.SceneLoader.ImportMeshAsync('','auto/Logan2_2017.glb','',scene);
    log('loaded');
  }catch(e){log('ERR load '+e);return;}
  try{
    const scene2=window.__scene;
    // ------ моделируем ту же логику, что в index.html updateCar ------
    const wheelMeshes=scene2.meshes.filter(m=>/wheel|tire|tyre/i.test(m.name));
    const piv=wheelMeshes.map(w=>{const b=w.getBoundingInfo().boundingBox;return {name:w.name,z:b.centerWorld.z};});
    log('wheel centers z: '+piv.map(p=>p.name.split(';').pop()+'='+p.z.toFixed(2)).join('  '));
  }catch(e){log('ERR w '+e);}
})();
</script></body></html>
